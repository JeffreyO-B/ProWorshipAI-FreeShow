<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ProWorshipAI — FreeShow Edition — Loading</title>

        <link rel="stylesheet" href="global.css" />

        <style>
            :root {
                --radius: 5px;
                --loader-height: 3px;
            }

            main {
                /* background-color: var(--primary); */
                background-color: #28276d;
                background: linear-gradient(140deg, #39215f 20%, #140e22);
                width: 100%;
                height: 100%;
                border-radius: var(--radius);

                display: flex;
                flex-direction: column;
                gap: 10px;
                justify-content: center;
                align-items: center;
                -webkit-app-region: drag;

                overflow: hidden;
            }

            img {
                height: calc(100% - var(--loader-height));
                width: 42%;
                object-fit: cover;
                object-position: top left;

                left: 0;
                /* max-width: 40%; */
                position: absolute;
                top: var(--loader-height);

                border-bottom-left-radius: var(--radius);
                border-top-right-radius: var(--radius);
            }

            .text {
                position: absolute;
                right: 0;
                width: 58%;

                text-align: center;
            }

            .v {
                opacity: 0.3;
                font-size: 0.9em;
            }

            h1 {
                font-size: 3em;
                background: -webkit-linear-gradient(340deg, #e9d5ff, #ad80ee);
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .loader {
                --margin: 1.5px; /* calc(var(--radius) / 2); */
                background-color: var(--primary-lighter);
                margin: 0 var(--margin);
                border-top-left-radius: 40px;
                border-top-right-radius: 40px;

                position: absolute;
                top: 0;
                width: calc(100% - (var(--margin) * 2));
                height: var(--loader-height);

                overflow: hidden;
            }

            .loader span:before {
                content: "";
                position: absolute;
                height: 100%;
                background-color: var(--secondary);
                animation: first 1.8s infinite ease-out;
            }

            .loader span:after {
                content: "";
                position: absolute;
                height: 100%;
                background-color: var(--secondary);
                animation: second 1.8s infinite ease-in;
            }

            @keyframes first {
                0% {
                    inset-inline-start: -100%;
                    width: 80%;
                }
                100% {
                    inset-inline-start: 100%;
                    width: 20%;
                }
            }

            @keyframes second {
                0% {
                    inset-inline-start: -150%;
                    width: 80%;
                }
                100% {
                    inset-inline-start: 100%;
                    width: 20%;
                }
            }
            .pw-mark { position: absolute; left: 9%; top: 25%; width: 145px; height: 145px; border-radius: 28px; display: grid; place-items: center; font-size: 3.5em; font-weight: 800; letter-spacing: -0.08em; color: #fff; background: linear-gradient(140deg, #744da3, #322055); box-shadow: 0 0 30px #13092180; }\n            .edition { color: #e5d3f3; letter-spacing: .14em; font-size: .9em; }\n            .text h1 { font-size: 2.3em; }\n        </style>
    </head>
    <body>
        <div class="loader">
            <span></span>
        </div>

        <main>
            <div class="pw-mark" aria-hidden="true">PW</div>

            <div class="text">
                <h1>ProWorshipAI</h1><p class="edition">FreeShow Edition</p>
                <p class="v">v<span class="version">0.0.0</span></p>
            </div>
        </main>

        <script>
            const { ipcRenderer } = require("electron")

            ipcRenderer.send("MAIN", { channel: "VERSION" })
            ipcRenderer.once("MAIN", (e, msg) => {
                if (msg.channel !== "VERSION" || !msg.data) return
                document.querySelector(".version").innerHTML = msg.data
            })
        </script>
    </body>
</html>
